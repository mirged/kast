[package]
name = "kast-render"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Photorealistic real-time renderer on wgpu: deferred PBR, IBL, cascaded PCSS shadows, SSAO, SSR, bloom, DoF and ACES tonemapping"
documentation = "https://docs.rs/kast-render"
repository = "https://github.com/mirged/kast"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Vladislav Buinickij <ntaip004@gmail.com>"]
keywords = ["wgpu", "renderer", "pbr", "graphics", "gamedev"]
categories = ["rendering", "graphics", "game-development"]

# The crates.io name `kast` belongs to an unrelated project, so the package is
# published as `kast-render`; the library crate keeps the name `kast`.
[lib]
name = "kast"
path = "src/lib.rs"

[[bin]]
name = "kast"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = "0.33.7"
gltf = { version = "1.4.1", features = ["KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_materials_unlit"] }
image = "0.25.10"
log = "0.4.34"
pollster = "1.0.1"
wgpu = "22.1.0"
winit = "0.30.13"
